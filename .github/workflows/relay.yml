name: VMess Relay Server avec Cloudflare

on:
  workflow_dispatch:
  push:

jobs:
  run-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install and Run Xray
      run: |
        echo "Téléchargement et installation de Xray-core..."
        sudo apt-get update && sudo apt-get install -y curl unzip
        
        # Téléchargement direct de Xray-core (version stable Linux 64-bit)
        curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
        unzip xray.zip -d xray-bin
        
        # Lancement de Xray en arrière-plan avec votre fichier config.json
        echo "Lancement du relais VMess local sur le port 8080..."
        ./xray-bin/xray run -c ./config.json &

    - name: Start Cloudflare Tunnel
      run: |
        echo "Téléchargement de Cloudflare Tunnel..."
        curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        
        echo "Génération de l'URL publique Cloudflare..."
        ./cloudflared tunnel --url http://localhost:8080 &
        
        # Attente pour laisser le tunnel s'établir
        sleep 10
        
        echo "===================================================="
        echo "REGARDEZ CI-DESSUS POUR TROUVER L'URL *.trycloudflare.com"
        echo "C'est cette URL que vous mettrez dans le champ HOST !"
        echo "===================================================="
        
        # Maintien du workflow en vie pendant 6 heures
        sleep 21590
